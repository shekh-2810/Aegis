<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aiges — Site blocked</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600&display=swap');
  :root {
    --risk: #DC2626;
    --risk-tint: #FDECEC;
    --ink: #0F1424;
    --muted: #68708A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    background: var(--risk-tint);
    color: var(--ink);
  }
  .card {
    max-width: 480px;
    width: 92%;
    background: #fff;
    border-radius: 16px;
    padding: 36px 32px;
    box-shadow: 0 20px 60px rgba(220,38,38,0.15);
    text-align: center;
  }
  .icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 16px;
  }
  h1 {
    font-family: 'Sora', sans-serif;
    font-size: 22px;
    color: var(--risk);
    margin: 0 0 8px;
  }
  p { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0 0 4px; }
  .url-box {
    background: #F8FAFC;
    border: 1px solid #E4E8F4;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12.5px;
    word-break: break-all;
    color: var(--ink);
    margin: 16px 0;
    font-family: monospace;
  }
  .reasons {
    text-align: left;
    background: var(--risk-tint);
    border-radius: 10px;
    padding: 14px 18px;
    margin: 16px 0;
    font-size: 13px;
    color: #7f1d1d;
  }
  .reasons li { margin-bottom: 6px; }
  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 12px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
  }
  #backBtn { background: var(--risk); color: #fff; }
  #proceedBtn { background: none; color: var(--muted); text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <svg class="icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#DC2626"/><path d="M12 7v6" stroke="white" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16.5" r="1.1" fill="white"/></svg>
    <h1>Aiges blocked this site</h1>
    <p>This page showed strong signs of phishing or fraud and was blocked before it could load.</p>
    <div class="url-box" id="blockedUrl">—</div>
    <ul class="reasons" id="reasonsList"></ul>
    <div class="actions">
      <button id="backBtn">Take me back to safety</button>
      <button id="proceedBtn">I understand the risk — proceed anyway</button>
    </div>
  </div>
  <script src="warning.js"></script>
</body>
</html>
